version: '3.9'

services:
  chatwoot-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./knowledgebase:/app/knowledgebase:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
